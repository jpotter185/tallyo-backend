spring:

  # MCP server at /mcp (tools in com.tallyo.tallyo_backend.mcp; OAuth in SecurityConfig).
  # Stateless streamable HTTP: no session between requests, which suits bearer-token auth.
  ai:
    mcp:
      server:
        name: tallyo
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        instructions: >-
          Sports data from ESPN, stored by tallyo: scores, schedules, records, betting spreads,
          standings, box scores, and NFL injuries. Leagues: nfl, cfb, nhl, mls, mlb. For "this
          week" or "today", use get_current_games, or get_context to fill in find_games filters.

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

espn:
  api:
    base-url: https://site.api.espn.com/apis/site/v2/sports
    core-base-url: https://sports.core.api.espn.com/v2/sports
    scoreboard:
      # ESPN silently falls back to a 25-event default when limit is too large
      # (confirmed: limit=1000 -> 25 events, limit=500 -> full real count) --
      # 500 is comfortably above any single day's real game count across our
      # leagues while staying under whatever threshold triggers the fallback.
      limit: 500
  standings:
    urls:
      nfl:
        - https://cdn.espn.com/core/nfl/standings?xhr=1
      cfb:
        - https://cdn.espn.com/core/college-football/standings?xhr=1
      nhl:
        - https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings?type=0&level=3&sort=playoffseed:asc,points:desc,gamesplayed:asc,rotwins:desc
        - https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings
        - https://cdn.espn.com/core/nhl/standings?xhr=1&seasontype=3
        - https://cdn.espn.com/core/nhl/standings?xhr=1&seasonType=3
        - https://cdn.espn.com/core/nhl/standings?xhr=1&type=3
        - https://cdn.espn.com/core/nhl/standings?xhr=1&view=wild-card
        - https://cdn.espn.com/core/nhl/standings?xhr=1
      mls:
        - https://site.api.espn.com/apis/v2/sports/soccer/usa.1/standings
        - https://cdn.espn.com/core/soccer/standings?xhr=1&league=usa.1
      mlb:
        - https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings?level=3
        - https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings
        - https://cdn.espn.com/core/mlb/standings?xhr=1

api:
  key: ${API_KEY}

# OAuth for the MCP routes (/mcp/**). Tokens come from Keycloak (repo tallyo-auth).
tallyo:
  oauth:
    issuer: ${OAUTH_ISSUER_URI:https://auth.tallyo.us/realms/tallyo}
    resource: https://api.tallyo.us/mcp
    scope: tallyo:read
    required-group: tallyo-backend

# Behind nginx: trust X-Forwarded-Proto/Host so request URLs (e.g. the protected-resource
# metadata link in 401 responses) use https://api.tallyo.us, not the container's http address.
server:
  forward-headers-strategy: native